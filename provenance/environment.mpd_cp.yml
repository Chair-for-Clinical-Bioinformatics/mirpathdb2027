# mpd_cp — R/Bioconductor enrichment toolchain (clusterProfiler + annotation DBs).
#
# These pins are TRANSCRIBED from the run manifests that recorded the toolchain
# which actually built the 76 production enrichment matrices:
#   provenance/production_pathways_manifest.json
#   provenance/macaque_inferred_reactome_manifest.json
# They capture the load-bearing, directly-named versions only. For a fully
# reproducible lock (transitive dependency pins), the environment owner should run
# `conda env export` from the built environment and paste the result over this file.
name: mpd_cp
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.3
  - r-clusterprofiler=4.18.4
  - bioconductor-dose=4.4.0
  - bioconductor-go.db=3.22.0
  - bioconductor-org.hs.eg.db=3.22.0
  - bioconductor-org.mm.eg.db=3.22.0
  - bioconductor-org.rn.eg.db=3.22.0
  - bioconductor-org.mmu.eg.db=3.22.0
  - bioconductor-reactome.db=1.95.0
  # AnnotationDbi is directly named — AnnotationDbi::select() does the SYMBOL<->ENTREZ /
  # GO / Reactome id mapping in the reactome, inferred-reactome, wikipathways and go
  # geneset builders and in production_target_sets. Version is the live mpd_cp build env
  # (the same env that produced the 76 matrices); it is not separately recorded in the
  # run manifests, so it is pinned here from that env rather than transcribed.
  - bioconductor-annotationdbi=1.72.0
  # NOTE: no rWikiPathways pin on purpose. WikiPathways gene sets are fetched as pinned
  # GMT files by dated archive URL (pathways/wikipathways_genesets.py), NOT via the R
  # package; rWikiPathways is not installed in mpd_cp and plays no part in the build. It
  # survives only in human notes documenting that macaque is absent from listOrganisms().
  # Leaving it here unpinned would float the whole conda solve — a reproducibility hazard.
